[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfse-bh"
version = "0.1.0"
description = "Automacao de coleta e validacao de NFS-e de Belo Horizonte (BHISS Digital)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
    "pydantic>=2.12.5",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.1",
    "beautifulsoup4>=4.14.3",
    "opencv-python>=4.13.0",
    "numpy>=2.4.4",
    "prometheus-client>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
]

[tool.setuptools.packages.find]
include = ["api*", "bot*", "captcha_solver*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
